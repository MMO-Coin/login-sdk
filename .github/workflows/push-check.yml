name: Push trigger check

on:
  push:
    branches: [main]

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify automatic push event
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = push
          echo "Push event received for $GITHUB_SHA"
